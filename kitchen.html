<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#56a5d9" />
    <title>海边寿司店 · 制作台</title>
    <link rel="stylesheet" href="style.css?v=sushi-menu-v102-20260806" />
    <link rel="preload" as="image" href="assets/restaurant/kitchen-layers/optimized/kitchen-background.jpg" fetchpriority="high" />
  </head>
  <body>
    <main id="kitchen-stage" class="game-stage kitchen-stage" aria-label="寿司制作后台">
      <img id="scene-background" class="kitchen-background" src="assets/restaurant/kitchen-layers/optimized/kitchen-background.jpg" alt="海边寿司厨房" fetchpriority="high" decoding="async" />
      <header class="game-header">
        <div><span>海边寿司店</span><b id="stage-name">营业制作台</b></div>
        <div class="day-card"><span id="day-label">第 1 天</span><b id="day-status">新手教程</b></div>
        <div class="cash-card"><span>余额</span><b id="cash-value">¥0</b></div>
      </header>

      <section id="customer-queue" class="customer-queue" aria-label="正在等待的客人"></section>
      <div class="customer-counter-front" aria-hidden="true"></div>

      <section id="ingredient-shop-panel" class="ingredient-shop-panel is-hidden" role="dialog" aria-modal="true" aria-labelledby="ingredient-shop-title" aria-describedby="ingredient-shop-description">
        <div class="ingredient-shop-window">
          <header class="ingredient-shop-header">
            <div class="ingredient-shop-heading">
              <span>海边采购站</span>
              <b id="ingredient-shop-title">采购商店</b>
              <p id="ingredient-shop-description">购买新鱼种后去海边钓到它；标有“前置”的商品，须先解锁对应物品。</p>
            </div>
            <div class="ingredient-shop-cash" aria-label="当前余额"><span>余额</span><b id="ingredient-shop-cash">¥0</b></div>
            <button id="ingredient-shop-close" class="ingredient-shop-close" type="button">返回制作台</button>
          </header>
          <section class="ingredient-shop-section" aria-labelledby="ingredient-shop-food-title">
            <div class="ingredient-shop-section-heading"><b id="ingredient-shop-food-title">食材与饮品</b><span>新鱼种要去钓鱼获得；饮品配方会直接加入饮品机。</span></div>
            <div id="ingredient-shop-items" class="ingredient-shop-items"></div>
          </section>
          <section class="storage-upgrade-section ingredient-shop-section" aria-labelledby="storage-upgrade-title">
            <div class="ingredient-shop-section-heading"><b id="storage-upgrade-title">店铺升级</b><span>扩充备料容量，让饮品机更快，冰柜能装下更多生鱼。</span></div>
            <div id="storage-upgrade-items" class="storage-upgrade-items"></div>
          </section>
          <section class="decoration-theme-section ingredient-shop-section" aria-labelledby="decoration-theme-title">
            <div class="ingredient-shop-section-heading"><b id="decoration-theme-title">店铺装修</b><span>购买主题后会保存，结算时可随时切换，装修会立刻出现在制作台。</span></div>
            <div id="decoration-theme-items" class="decoration-theme-items"></div>
          </section>
        </div>
      </section>

      <section class="work-counter" aria-label="寿司制作操作台">
        <section class="fish-station" aria-label="三格冰柜">
          <img src="assets/restaurant/kitchen-layers/optimized/fish-well-frosted-vivid-v2.png" alt="磨砂三格冰柜" decoding="async" />
          <button id="freezer-button" class="freezer-button" type="button" aria-label="点击冰柜选择刺身"></button>
          <div id="sashimi-picker" class="sashimi-picker is-hidden" role="dialog" aria-label="选择食材">
            <button id="select-salmon" class="sashimi-choice" type="button" data-ingredient-id="salmon" aria-label="选择三文鱼刺身">
              <img src="assets/restaurant/kitchen-layers/optimized/salmon-loin-vivid-v1.png" alt="" draggable="false" decoding="async" loading="lazy" />
              <span class="sashimi-choice-name">三文鱼刺身</span>
              <small class="sashimi-stock" data-fish-stock="salmon">库存 0</small>
            </button>
            <button id="select-tuna" class="sashimi-choice" type="button" data-ingredient-id="tuna" aria-label="选择金枪鱼刺身">
              <img src="assets/restaurant/kitchen-layers/optimized/tuna-loin-vivid-v1.png" alt="" draggable="false" decoding="async" loading="lazy" />
              <span class="sashimi-choice-name">金枪鱼刺身</span>
              <small class="sashimi-stock" data-fish-stock="tuna">库存 0</small>
            </button>
            <button id="select-shrimp" class="sashimi-choice" type="button" data-ingredient-id="shrimp" aria-label="选择甜虾">
              <img src="assets/restaurant/kitchen-layers/optimized/shrimp-whole-vivid-v1.png" alt="" draggable="false" decoding="async" loading="lazy" />
              <span class="sashimi-choice-name">甜虾食材</span>
              <small class="sashimi-stock" data-fish-stock="shrimp">库存 0</small>
            </button>
            <button id="select-mackerel" class="sashimi-choice" type="button" data-ingredient-id="mackerel" aria-label="选择鲭鱼刺身">
              <img src="assets/restaurant/kitchen-layers/optimized/mackerel-loin-vivid-v1.png" alt="" draggable="false" decoding="async" loading="lazy" />
              <span class="sashimi-choice-name">鲭鱼刺身</span>
              <small class="sashimi-stock" data-fish-stock="mackerel">库存 0</small>
            </button>
            <button id="select-seabream" class="sashimi-choice" type="button" data-ingredient-id="seabream" aria-label="选择真鲷刺身">
              <img src="assets/restaurant/kitchen-layers/optimized/seabream-loin-vivid-v1.png" alt="" draggable="false" decoding="async" loading="lazy" />
              <span class="sashimi-choice-name">真鲷刺身</span>
              <small class="sashimi-stock" data-fish-stock="seabream">库存 0</small>
            </button>
            <button id="select-eel" class="sashimi-choice" type="button" data-ingredient-id="eel" aria-label="选择蒲烧鳗鱼">
              <img src="assets/restaurant/kitchen-layers/optimized/eel-loin-vivid-v1.png" alt="" draggable="false" decoding="async" loading="lazy" />
              <span class="sashimi-choice-name">鳗鱼蒲烧</span>
              <small class="sashimi-stock" data-fish-stock="eel">库存 0</small>
            </button>
            <button id="select-tamago" class="sashimi-choice" type="button" data-ingredient-id="tamago" aria-label="选择玉子烧">
              <img src="assets/restaurant/kitchen-layers/optimized/tamago-loin-vivid-v1.png" alt="" draggable="false" decoding="async" />
              <span class="sashimi-choice-name">玉子烧</span>
              <small class="sashimi-stock sashimi-stock-unlimited">无限</small>
            </button>
            <button id="select-uni" class="sashimi-choice" type="button" data-ingredient-id="uni" aria-label="选择海胆军舰食材">
              <img src="assets/restaurant/kitchen-layers/optimized/uni-loin.png" alt="" draggable="false" decoding="async" loading="lazy" />
              <span class="sashimi-choice-name">海胆军舰</span>
              <small class="sashimi-stock sashimi-stock-unlimited">无限</small>
            </button>
            <button id="select-roe" class="sashimi-choice" type="button" data-ingredient-id="roe" aria-label="选择鱼籽军舰食材">
              <img src="assets/restaurant/kitchen-layers/optimized/roe-loin.png" alt="" draggable="false" decoding="async" loading="lazy" />
              <span class="sashimi-choice-name">鱼籽军舰</span>
              <small class="sashimi-stock sashimi-stock-unlimited">无限</small>
            </button>
          </div>
        </section>

        <section class="board-station" aria-label="切菜板">
          <img class="cutting-board" src="assets/restaurant/kitchen-layers/optimized/cutting-board-vivid-v1.png" alt="切菜板" decoding="async" />
          <button id="board-salmon" class="board-salmon is-hidden" type="button" aria-label="食材，在虚线附近按住并向下滑动切片">
            <img id="board-ingredient-image" src="assets/restaurant/kitchen-layers/optimized/salmon-loin-vivid-v1.png" alt="待切三文鱼" draggable="false" decoding="async" loading="lazy" />
            <span class="cut-guide guide-one" aria-hidden="true"></span>
            <span class="cut-guide guide-two" aria-hidden="true"></span>
            <span class="cut-guide guide-three" aria-hidden="true"></span>
            <span class="shrimp-cut-guide" aria-hidden="true"></span>
          </button>
          <div id="shrimp-batch" class="shrimp-batch is-hidden" aria-label="待处理的四只甜虾"></div>
          <div id="shrimp-head-rack" class="shrimp-head-rack is-hidden" aria-label="待丢弃的虾头"></div>
        </section>

        <button id="trash-bin" class="station trash-bin" type="button" aria-label="垃圾桶，拖入物品丢弃；点击可清空菜板上的食材">
          <img src="assets/restaurant/kitchen-layers/optimized/trash-bin-vivid-v1.png" alt="垃圾桶" draggable="false" decoding="async" />
        </button>

        <section class="assembly-station" aria-label="寿司制作区，在切菜板旁边">
          <div id="slice-rack" class="slice-rack" aria-label="切好的寿司配料"></div>
          <div id="rice-rack" class="stock-rack rice-rack" aria-label="已存米饭"></div>
          <div id="sushi-rack" class="stock-rack sushi-rack" aria-label="已做寿司"></div>
        </section>

        <section id="platter-station" class="station platter-station is-hidden" aria-label="刺身拼盘盘子，拖入三片同种鱼或三种不同鱼片制作拼盘">
          <img src="assets/restaurant/kitchen-layers/optimized/plate-stack.png" alt="刺身拼盘盘子" draggable="false" decoding="async" loading="lazy" />
          <div id="platter-slice-preview" class="platter-slice-preview" aria-hidden="true"></div>
        </section>

        <button id="rice-bin" class="station rice-station" type="button" aria-label="点击从饭盒拿一团米饭">
          <img src="assets/restaurant/kitchen-layers/optimized/rice-bin-vivid-v1.png" alt="装满米饭的饭盒" draggable="false" decoding="async" />
        </button>
        <button id="drink-machine" class="station drink-machine-station" type="button" aria-label="饮品机，点击接饮料">
          <img src="assets/restaurant/kitchen-layers/optimized/drink-machine-opaque-vivid-v1.png" alt="不透明饮品机" draggable="false" decoding="async" />
        </button>
        <section id="drink-picker" class="drink-picker is-hidden" aria-label="选择要制作的饮品"></section>
        <img id="machine-cup" class="machine-cup is-hidden" src="assets/restaurant/kitchen-layers/optimized/tea-cup-empty-vivid-v1.png" alt="" aria-hidden="true" draggable="false" decoding="async" loading="lazy" />
        <div id="drink-rack" class="drink-rack" aria-label="已做好饮料"></div>
        <button id="cup-station" class="station cup-station" type="button" aria-label="从杯子区拖出空杯">
          <img src="assets/restaurant/kitchen-layers/optimized/cup-station-vivid-v1.png" alt="杯子区" draggable="false" decoding="async" />
        </button>
      </section>

      <aside id="tutorial-guide" class="tutorial-guide" aria-live="polite" aria-label="新手教程">
        <div class="tutorial-guide-card">
          <span id="tutorial-step-label">新手教程</span>
          <b id="tutorial-title">欢迎来到海边寿司店</b>
          <p id="tutorial-description">跟着做出第一份玉子烧寿司，再交给第一位客人吧。</p>
          <div class="tutorial-actions">
            <button id="tutorial-start-button" type="button">开始学习</button>
            <button id="tutorial-skip-button" class="tutorial-skip-button" type="button">跳过教程</button>
          </div>
        </div>
      </aside>

      <section id="day-summary-overlay" class="day-summary-overlay is-hidden" role="dialog" aria-modal="true" aria-labelledby="day-summary-title">
        <div class="day-summary-card">
          <b id="day-summary-title">今天结束啦</b>
          <button id="day-summary-dismiss" class="day-summary-dismiss" type="button">知道了</button>
        </div>
      </section>

      <div class="game-bottom-bar">
        <span id="kitchen-message" class="screen-reader-status" aria-live="polite">点击冰柜选择食材，把它放到切菜板。</span>
        <button id="game-pause-button" class="icon-control pause-control" type="button" aria-label="暂停游戏" title="暂停游戏" aria-pressed="false" data-icon="pause">
          <svg class="control-icon" data-control-icon="pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5h3.3v13H7zM13.7 5.5H17v13h-3.3z" /></svg>
          <svg class="control-icon" data-control-icon="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2 18.3 12 8 18.8z" /></svg>
        </button>
        <div id="settlement-actions" class="settlement-actions is-hidden" aria-label="今日结算操作">
          <button id="ingredient-shop-toggle" class="ingredient-shop-toggle icon-control" type="button" aria-label="采购商店" title="采购商店" aria-controls="ingredient-shop-panel" aria-expanded="false">
            <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 8.4h13.6l-1 10.1H6.2zm3-3.2h7.6l1 3.2H7.2zM9.4 12.2v3.1m5.2-3.1v3.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <button id="go-fishing-button" class="pause-secondary-button icon-control" type="button" aria-label="去钓鱼" title="去钓鱼">
            <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.4 12.3c2.3-3.6 5.4-5.4 9.2-5.4 2.6 0 4.8.9 6 2.5-1.2 1.7-3.4 2.6-6 2.6-3.8 0-6.9-1.8-9.2-5.4Zm8.2-1.3a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Z" fill="currentColor" /><path d="M19.2 5c.5 2.7-.2 5-2.2 6.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
          </button>
          <button id="open-shop-button" class="day-next-button icon-control" type="button" aria-label="开始下一天" title="开始下一天">
            <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.2v3M5.9 6.7l2.1 2.1m10.1-2.1L16 8.8M4.6 13h2.9m9 0h2.9M7.4 17.4h9.2M8.7 13a3.3 3.3 0 0 1 6.6 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /><path d="M4.6 19.1h14.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
          </button>
        </div>
      </div>
      <section id="game-pause-overlay" class="game-pause-overlay is-hidden" role="dialog" aria-modal="true" aria-label="暂停菜单">
        <div class="game-pause-card">
          <section id="game-pause-menu" class="game-pause-view" aria-labelledby="game-pause-title">
            <span>海边寿司店</span>
            <b id="game-pause-title">游戏暂停</b>
            <div class="game-pause-actions">
              <button id="resume-game-button" type="button">继续游戏</button>
              <button id="open-game-settings-button" class="pause-secondary-button" type="button">设置</button>
              <button id="exit-game-button" class="pause-exit-button" type="button">退出游戏</button>
            </div>
          </section>
          <section id="game-settings-panel" class="game-pause-view is-hidden" aria-labelledby="game-settings-title">
            <span>设置</span>
            <b id="game-settings-title">游戏设置</b>
            <div class="game-setting-row">
              <span>音效</span>
              <button id="sound-setting-button" type="button" aria-pressed="true">已开启</button>
            </div>
            <label class="game-setting-row game-volume-setting" for="sound-volume-setting">
              <span>音量</span>
              <span class="game-volume-control">
                <input id="sound-volume-setting" type="range" min="0" max="80" value="48" step="1" aria-label="音效音量" />
                <output id="sound-volume-value" for="sound-volume-setting">48%</output>
              </span>
            </label>
            <button id="close-game-settings-button" class="pause-secondary-button" type="button">返回</button>
          </section>
        </div>
      </section>
      <div id="exit-loading-overlay" class="menu-loading-screen kitchen-exit-loading" role="status" aria-live="polite" aria-label="正在返回主菜单" aria-hidden="true">
        <div class="menu-loading-sushi" aria-hidden="true">
          <img class="menu-loading-rice" src="assets/restaurant/kitchen-layers/optimized/rice-portion-vivid-v1.png" alt="" />
          <img class="menu-loading-salmon" src="assets/restaurant/kitchen-layers/optimized/salmon-slice-vivid-v1.png" alt="" />
          <img class="menu-loading-finished" src="assets/restaurant/kitchen-layers/optimized/salmon-nigiri-vivid-v1.png" alt="" />
        </div>
        <span>正在返回</span>
      </div>
    </main>
    <script src="audio.js?v=material-foley-v4-20260805"></script>
    <script src="leaderboard-client.js?v=online-board-v3-20260805"></script>
    <script src="kitchen.js?v=sushi-menu-v103-20260806"></script>
  </body>
</html>
