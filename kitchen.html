<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#56a5d9" />
    <title>海边寿司店 · 制作台</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="kitchen-stage" class="game-stage kitchen-stage" aria-label="寿司制作后台">
      <img class="kitchen-background" src="assets/restaurant/kitchen-layers/kitchen-background.png" alt="海边寿司厨房" />
      <header class="game-header">
        <div><span>第 1 天</span><b>寿司制作台</b></div>
        <div class="order-card"><span>今日练习</span><b>三文鱼握寿司</b></div>
      </header>

      <section class="work-counter" aria-label="寿司制作操作台">
        <section class="fish-station" aria-label="玻璃鱼柜，共三格">
          <img src="assets/restaurant/kitchen-layers/fish-well.png" alt="三格玻璃鱼柜" />
          <button id="display-salmon" class="display-salmon" type="button" aria-label="取出第一格中的大三文鱼">
            <img src="assets/restaurant/kitchen-layers/salmon-loin.png" alt="大三文鱼" />
          </button>
        </section>

        <section class="board-station" aria-label="切菜板">
          <img class="cutting-board" src="assets/restaurant/kitchen-layers/cutting-board.png" alt="切菜板" />
          <button id="board-salmon" class="board-salmon is-hidden" type="button" aria-label="大三文鱼，拿刀后点击切片">
            <img src="assets/restaurant/kitchen-layers/salmon-loin.png" alt="待切三文鱼" />
          </button>
          <div id="cut-progress" class="cut-progress is-hidden" role="progressbar" aria-label="三文鱼切片进度" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><span></span></div>
        </section>

        <section class="assembly-station" aria-label="寿司制作区，在切菜板旁边">
          <div id="slice-rack" class="slice-rack" aria-label="切好的三文鱼片"></div>
          <button id="rice-portion" class="rice-portion is-hidden" type="button" aria-label="一团米饭">
            <img src="assets/restaurant/kitchen-layers/rice-portion.png" alt="一团米饭" />
          </button>
          <img id="finished-sushi" class="finished-sushi is-hidden" src="assets/restaurant/kitchen-layers/salmon-nigiri.png" alt="完成的三文鱼握寿司" />
        </section>

        <button id="knife" class="station knife-station" type="button" aria-label="拿起刀">
          <img src="assets/restaurant/kitchen-layers/knife.png" alt="刀" />
        </button>

        <button id="rice-bin" class="station rice-station" type="button" aria-label="从饭盒取米饭">
          <img src="assets/restaurant/kitchen-layers/rice-bin.png" alt="装满米饭的饭盒" />
        </button>
        <button id="drink-machine" class="station drink-machine-station" type="button" aria-label="饮品机，暂未开放">
          <img src="assets/restaurant/kitchen-layers/drink-machine.png" alt="饮品机" />
        </button>
        <button id="cup-station" class="station cup-station" type="button" aria-label="杯子区，暂未开放">
          <img src="assets/restaurant/kitchen-layers/cup-station.png" alt="杯子区" />
        </button>
      </section>

      <img id="held-knife" class="held-knife is-hidden" src="assets/restaurant/kitchen-layers/knife.png" alt="" aria-hidden="true" />
      <div class="game-bottom-bar">
        <span id="kitchen-message" class="screen-reader-status" aria-live="polite">点击鱼柜第一格的大三文鱼，把它放到切菜板。</span>
        <button id="reset-button" type="button">重做</button>
        <button id="serve-button" type="button" disabled>完成寿司</button>
      </div>
    </main>
    <script src="kitchen.js"></script>
  </body>
</html>
