<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#56a5d9" />
    <title>海边寿司店 · 制作台</title>
    <link rel="stylesheet" href="style.css?v=modal-motion-v32-20260804" />
    <link rel="preload" as="image" href="assets/restaurant/kitchen-layers/optimized/kitchen-background.jpg" fetchpriority="high" />
  </head>
  <body>
    <main id="kitchen-stage" class="game-stage kitchen-stage" aria-label="寿司制作后台">
      <img id="scene-background" class="kitchen-background" src="assets/restaurant/kitchen-layers/optimized/kitchen-background.jpg" alt="海边寿司厨房" fetchpriority="high" decoding="async" />
      <header class="game-header">
        <div><span>海边寿司店</span><b id="stage-name">营业制作台</b></div>
        <div class="day-card"><span id="day-label">第 1 天</span><b id="day-status">新手教程</b></div>
        <div class="order-card"><span id="shop-status">营业中</span><b id="shop-status-detail">第一单新手教程</b></div>
        <div class="cash-card"><span>余额</span><b id="cash-value">¥0</b></div>
      </header>

      <section id="customer-queue" class="customer-queue" aria-label="正在等待的客人"></section>
      <div class="customer-counter-front" aria-hidden="true"></div>

      <section id="ingredient-shop-panel" class="ingredient-shop-panel is-hidden" role="dialog" aria-modal="true" aria-labelledby="ingredient-shop-title" aria-describedby="ingredient-shop-description">
        <div class="ingredient-shop-window">
          <header class="ingredient-shop-header">
            <div class="ingredient-shop-heading">
              <span>海边采购站</span>
              <b id="ingredient-shop-title">采购商店</b>
              <p id="ingredient-shop-description">解锁食材后，在每天结算时去海边钓到它。</p>
            </div>
            <div class="ingredient-shop-cash" aria-label="当前余额"><span>余额</span><b id="ingredient-shop-cash">¥0</b></div>
            <button id="ingredient-shop-close" class="ingredient-shop-close" type="button">返回制作台</button>
          </header>
          <section class="ingredient-shop-section" aria-labelledby="ingredient-shop-food-title">
            <div class="ingredient-shop-section-heading"><b id="ingredient-shop-food-title">食材解锁</b><span>购买后，在钓鱼时才会遇到新鱼种。</span></div>
            <div id="ingredient-shop-items" class="ingredient-shop-items"></div>
          </section>
          <section class="storage-upgrade-section ingredient-shop-section" aria-labelledby="storage-upgrade-title">
            <div class="ingredient-shop-section-heading"><b id="storage-upgrade-title">库存扩容</b><span>寿司、鱼片和茶水都能存得更多。</span></div>
            <div id="storage-upgrade-items" class="storage-upgrade-items"></div>
          </section>
        </div>
      </section>

      <section class="work-counter" aria-label="寿司制作操作台">
        <section class="fish-station" aria-label="三格冰柜">
          <img src="assets/restaurant/kitchen-layers/optimized/fish-well-frosted.png" alt="磨砂三格冰柜" decoding="async" />
          <button id="freezer-button" class="freezer-button" type="button" aria-label="点击冰柜选择刺身"></button>
          <div id="sashimi-picker" class="sashimi-picker is-hidden" role="dialog" aria-label="选择食材">
            <button id="select-salmon" class="sashimi-choice" type="button" data-ingredient-id="salmon" aria-label="选择三文鱼刺身">
              <img src="assets/restaurant/kitchen-layers/optimized/salmon-loin.png" alt="" draggable="false" decoding="async" />
              <span class="sashimi-choice-name">三文鱼刺身</span>
              <small class="sashimi-stock" data-fish-stock="salmon">库存 0</small>
            </button>
            <button id="select-tuna" class="sashimi-choice" type="button" data-ingredient-id="tuna" aria-label="选择金枪鱼刺身">
              <img src="assets/restaurant/kitchen-layers/optimized/tuna-loin.png" alt="" draggable="false" decoding="async" />
              <span class="sashimi-choice-name">金枪鱼刺身</span>
              <small class="sashimi-stock" data-fish-stock="tuna">库存 0</small>
            </button>
            <button id="select-shrimp" class="sashimi-choice" type="button" data-ingredient-id="shrimp" aria-label="选择甜虾">
              <img src="assets/restaurant/kitchen-layers/optimized/shrimp-whole.png" alt="" draggable="false" decoding="async" />
              <span class="sashimi-choice-name">甜虾食材</span>
              <small class="sashimi-stock" data-fish-stock="shrimp">库存 0</small>
            </button>
            <button id="select-tamago" class="sashimi-choice" type="button" data-ingredient-id="tamago" aria-label="选择玉子烧">
              <img src="assets/restaurant/kitchen-layers/optimized/tamago-loin.png" alt="" draggable="false" decoding="async" />
              <span class="sashimi-choice-name">玉子烧</span>
              <small class="sashimi-stock sashimi-stock-unlimited">无限</small>
            </button>
          </div>
        </section>

        <section class="board-station" aria-label="切菜板">
          <img class="cutting-board" src="assets/restaurant/kitchen-layers/optimized/cutting-board.png" alt="切菜板" decoding="async" />
          <button id="board-salmon" class="board-salmon is-hidden" type="button" aria-label="食材，在虚线附近按住并向下滑动切片">
            <img id="board-ingredient-image" src="assets/restaurant/kitchen-layers/optimized/salmon-loin.png" alt="待切三文鱼" draggable="false" decoding="async" />
            <span class="cut-guide guide-one" aria-hidden="true"></span>
            <span class="cut-guide guide-two" aria-hidden="true"></span>
            <span class="cut-guide guide-three" aria-hidden="true"></span>
            <span class="shrimp-cut-guide" aria-hidden="true"></span>
          </button>
          <div id="shrimp-batch" class="shrimp-batch is-hidden" aria-label="待处理的四只甜虾"></div>
          <div id="shrimp-head-rack" class="shrimp-head-rack is-hidden" aria-label="待丢弃的虾头"></div>
        </section>

        <button id="trash-bin" class="station trash-bin" type="button" aria-label="垃圾桶，拖虾头到这里丢弃">
          <img src="assets/restaurant/kitchen-layers/optimized/trash-bin.png" alt="垃圾桶" draggable="false" decoding="async" />
        </button>

        <section class="assembly-station" aria-label="寿司制作区，在切菜板旁边">
          <div id="slice-rack" class="slice-rack" aria-label="切好的寿司配料"></div>
          <div id="rice-rack" class="stock-rack rice-rack" aria-label="已存米饭"></div>
          <div id="sushi-rack" class="stock-rack sushi-rack" aria-label="已做寿司"></div>
        </section>

        <button id="rice-bin" class="station rice-station" type="button" aria-label="点击从饭盒拿一团米饭">
          <img src="assets/restaurant/kitchen-layers/optimized/rice-bin.png" alt="装满米饭的饭盒" draggable="false" decoding="async" />
        </button>
        <button id="drink-machine" class="station drink-machine-station" type="button" aria-label="饮品机，点击接饮料">
          <img src="assets/restaurant/kitchen-layers/optimized/drink-machine-opaque.png" alt="不透明饮品机" draggable="false" decoding="async" />
        </button>
        <img id="machine-cup" class="machine-cup is-hidden" src="assets/restaurant/kitchen-layers/optimized/tea-cup-empty.png" alt="" aria-hidden="true" draggable="false" decoding="async" />
        <div id="drink-rack" class="drink-rack" aria-label="已做好饮料"></div>
        <button id="cup-station" class="station cup-station" type="button" aria-label="从杯子区拖出空杯">
          <img src="assets/restaurant/kitchen-layers/optimized/cup-station.png" alt="杯子区" draggable="false" decoding="async" />
        </button>
      </section>

      <aside id="tutorial-guide" class="tutorial-guide" aria-live="polite" aria-label="新手教程">
        <div class="tutorial-guide-card">
          <span id="tutorial-step-label">新手教程</span>
          <b id="tutorial-title">欢迎来到海边寿司店</b>
          <p id="tutorial-description">跟着做出第一份玉子烧寿司，再交给第一位客人吧。</p>
          <div class="tutorial-actions">
            <button id="tutorial-start-button" type="button">开始学习</button>
            <button id="tutorial-skip-button" class="tutorial-skip-button" type="button">跳过教程</button>
          </div>
        </div>
      </aside>

      <section id="day-summary-overlay" class="day-summary-overlay is-hidden" role="dialog" aria-modal="true" aria-labelledby="day-summary-title" aria-describedby="day-summary-note">
        <div class="day-summary-card">
          <b id="day-summary-title">今天结束啦</b>
          <p id="day-summary-note">今天的营业已经结束。</p>
          <button id="day-summary-dismiss" class="day-summary-dismiss" type="button">知道了</button>
        </div>
      </section>

      <div class="game-bottom-bar">
        <span id="kitchen-message" class="screen-reader-status" aria-live="polite">点击冰柜选择食材，把它放到切菜板。</span>
        <button id="game-pause-button" type="button" aria-pressed="false">暂停</button>
        <button id="pause-shop-button" class="is-hidden" type="button">提前打烊</button>
        <div id="settlement-actions" class="settlement-actions is-hidden" aria-label="今日结算操作">
          <button id="ingredient-shop-toggle" class="ingredient-shop-toggle" type="button" aria-controls="ingredient-shop-panel" aria-expanded="false">采购商店</button>
          <button id="go-fishing-button" class="pause-secondary-button" type="button">去钓鱼</button>
          <button id="open-shop-button" class="day-next-button" type="button">开始第 2 天</button>
        </div>
      </div>
      <section id="game-pause-overlay" class="game-pause-overlay is-hidden" role="dialog" aria-modal="true" aria-label="暂停菜单">
        <div class="game-pause-card">
          <section id="game-pause-menu" class="game-pause-view" aria-labelledby="game-pause-title">
            <span>海边寿司店</span>
            <b id="game-pause-title">游戏暂停</b>
            <p>客人和制作进度都已暂停。</p>
            <div class="game-pause-actions">
              <button id="resume-game-button" type="button">继续游戏</button>
              <button id="open-game-settings-button" class="pause-secondary-button" type="button">设置</button>
              <button id="exit-game-button" class="pause-exit-button" type="button">退出游戏</button>
            </div>
            <small>按 Esc 也能继续</small>
          </section>
          <section id="game-settings-panel" class="game-pause-view is-hidden" aria-labelledby="game-settings-title">
            <span>设置</span>
            <b id="game-settings-title">游戏设置</b>
            <p>按你的习惯调整画面效果。</p>
            <div class="game-setting-row">
              <span>动态效果</span>
              <button id="motion-setting-button" type="button" aria-pressed="true">已开启</button>
            </div>
            <button id="close-game-settings-button" class="pause-secondary-button" type="button">返回</button>
          </section>
        </div>
      </section>
    </main>
    <script src="kitchen.js?v=modal-motion-v34-20260804"></script>
  </body>
</html>
