<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eecca0" />
    <title>海边寿司店</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="restaurant-screen" aria-label="海边寿司店餐厅场景">
      <img class="restaurant-scene" src="assets/restaurant/restaurant-scene.png" alt="海边寿司店餐厅" />
      <div class="day-card"><span>第 1 天</span><b>营业中</b></div>
      <div class="restaurant-actions" aria-label="餐厅操作">
        <button id="backstage-button" type="button">进入后台</button>
        <button id="close-button" type="button">打烊</button>
      </div>
      <p id="restaurant-message" class="restaurant-message" aria-live="polite">客人在餐厅用餐，寿司在后台制作。</p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
