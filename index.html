<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4bd79" />
    <title>海边寿司店</title>
    <link rel="stylesheet" href="style.css?v=sushi-menu-v85-20260805" />
    <link rel="preload" as="image" href="assets/menu/sushi-shop-menu-background.jpg?v=menu-exterior-20260802b" fetchpriority="high" />
  </head>
  <body>
    <main class="game-stage main-menu-stage" aria-label="海边寿司店主菜单">
      <img class="menu-background" src="assets/menu/sushi-shop-menu-background.jpg?v=menu-exterior-20260802b" alt="海边寿司店外观" fetchpriority="high" decoding="async" />
      <div class="menu-wash" aria-hidden="true"></div>
      <section class="main-menu-card">
        <p class="main-menu-kicker">海边小店 · 今日营业中</p>
        <h1 class="main-menu-title"><span>海边</span>寿司店</h1>
        <p class="main-menu-description">把新鲜的海味，做成最暖的一口。</p>
        <button id="start-button" class="main-menu-start" type="button">
          <span>开始游戏</span>
          <small>走进寿司店</small>
        </button>
        <button id="wealth-leaderboard-button" class="main-menu-ranking" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span>财富排行榜</span>
          <small>全服店主排行</small>
        </button>
        <button id="reset-save-button" class="main-menu-reset" type="button" aria-haspopup="dialog" aria-expanded="false">重置存档</button>
        <p id="save-reset-status" class="menu-save-status" aria-live="polite"></p>
      </section>
      <section id="reset-save-dialog" class="save-reset-dialog is-hidden" role="alertdialog" aria-modal="true" aria-hidden="true" aria-labelledby="reset-save-title" aria-describedby="reset-save-description">
        <div class="save-reset-card">
          <span>请确认</span>
          <b id="reset-save-title">要重置存档吗？</b>
          <p id="reset-save-description">营业额、已购买配方和库存都会清空，无法恢复。</p>
          <div class="save-reset-actions">
            <button id="cancel-reset-save-button" class="save-reset-cancel" type="button">取消</button>
            <button id="confirm-reset-save-button" class="save-reset-confirm" type="button">确认重置</button>
          </div>
        </div>
      </section>
      <section id="wealth-leaderboard-dialog" class="wealth-leaderboard-dialog is-hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="wealth-leaderboard-title" aria-describedby="wealth-leaderboard-description">
        <div class="wealth-leaderboard-card">
          <header class="wealth-leaderboard-heading">
            <span>海边店主榜</span>
            <b id="wealth-leaderboard-title">财富排行榜</b>
            <p id="wealth-leaderboard-description">所有店主的在线营业额都会在这里排名。</p>
          </header>
          <section class="wealth-leaderboard-hero" aria-label="我的财富成绩">
            <span>我的在线营业额</span>
            <strong id="wealth-leaderboard-total">—</strong>
            <small id="wealth-leaderboard-rank">正在连接排行榜</small>
          </section>
          <ol id="wealth-leaderboard-list" class="wealth-leaderboard-list" aria-label="全服财富排行榜列表"></ol>
          <button id="close-wealth-leaderboard-button" class="wealth-leaderboard-close" type="button">知道了</button>
        </div>
      </section>
      <div class="menu-loading-screen" role="status" aria-live="polite" aria-label="加载中">
        <div class="menu-loading-sushi" aria-hidden="true">
          <img class="menu-loading-rice" src="assets/restaurant/kitchen-layers/optimized/rice-portion.png" alt="" />
          <img class="menu-loading-salmon" src="assets/restaurant/kitchen-layers/optimized/salmon-slice.png" alt="" />
          <img class="menu-loading-finished" src="assets/restaurant/kitchen-layers/optimized/salmon-nigiri.png" alt="" />
        </div>
        <span>加载中</span>
      </div>
    </main>
    <script src="audio.js?v=material-foley-v4-20260805"></script>
    <script src="leaderboard-client.js?v=online-board-v1-20260804"></script>
    <script src="game.js?v=sushi-menu-v85-20260805"></script>
  </body>
</html>
