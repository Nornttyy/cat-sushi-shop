<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8ecd9" />
    <title>寿司店</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="寿司店游戏">
      <header class="statusbar">
        <span class="day-badge">第 <b id="day-count">1</b> 天</span>
        <h1>寿司店</h1>
        <span class="coin-count" aria-label="收入"><i>●</i><b id="coins">0</b></span>
      </header>

      <section class="shop-wall">
        <img class="wooden-sign" src="assets/wooden-sign.svg" alt="木招牌" />
        <div class="sign-copy">寿司店</div>
        <div class="open-light"><i></i>营业中</div>
      </section>

      <section class="order-area" aria-label="当前订单">
        <div class="customer-mark" aria-hidden="true"><i></i><span></span></div>
        <div class="order-card">
          <span class="order-label">客人想要</span>
          <div class="order-line">
            <span id="order-icon" class="sushi-icon salmon" aria-hidden="true"><i></i></span>
            <strong id="order-name">三文鱼寿司</strong>
          </div>
          <small>米饭 + <span id="order-topping">三文鱼</span></small>
        </div>
        <div class="timer" aria-label="剩余时间"><span id="timer-fill"></span></div>
      </section>

      <section class="kitchen" aria-label="寿司制作区">
        <div class="plate-area">
          <div id="plate" class="plate" aria-label="正在制作的寿司">
            <span class="plate-rim"></span>
            <div id="dish" class="dish"></div>
          </div>
          <p id="hint" class="hint" aria-live="polite">先放一团米饭</p>
        </div>
        <img class="prep-table" src="assets/sushi-prep-table.svg" alt="寿司制作桌" />
      </section>

      <section class="ingredients" aria-label="选择食材">
        <button class="ingredient rice" data-ingredient="rice" type="button"><span class="ingredient-picture"></span><b>米饭</b></button>
        <button class="ingredient salmon" data-ingredient="salmon" type="button"><span class="ingredient-picture"></span><b>三文鱼</b></button>
        <button class="ingredient shrimp" data-ingredient="shrimp" type="button"><span class="ingredient-picture"></span><b>虾</b></button>
        <button class="ingredient egg" data-ingredient="egg" type="button"><span class="ingredient-picture"></span><b>玉子</b></button>
      </section>

      <section class="action-row" aria-label="制作操作">
        <button id="clear-dish" class="small-action" type="button">重做</button>
        <button id="serve-dish" class="serve-button" type="button" disabled>交给客人</button>
      </section>

      <section class="conveyor-area" aria-label="寿司传送带">
        <div class="conveyor-wrap">
          <img src="assets/sushi-conveyor.svg" alt="寿司传送带" />
          <span id="belt-dish-a" class="belt-dish salmon"><i></i></span>
          <span id="belt-dish-b" class="belt-dish egg"><i></i></span>
          <span id="belt-dish-c" class="belt-dish shrimp"><i></i></span>
        </div>
        <div class="belt-controls">
          <button id="move-left" type="button" aria-label="传送带往左移动"><img src="assets/button-left.svg" alt="" /></button>
          <span>传送带</span>
          <button id="move-right" type="button" aria-label="传送带往右移动"><img src="assets/button-right.svg" alt="" /></button>
        </div>
      </section>
    </main>

    <dialog id="result-dialog">
      <div class="dialog-star">✦</div>
      <h2 id="result-title">今天打烊啦</h2>
      <p>你今天卖出了 <b id="served-count">0</b> 份寿司</p>
      <p>收入 <b id="final-coins">0</b> 枚硬币</p>
      <button id="restart" type="button">再开一天</button>
    </dialog>
    <script src="game.js"></script>
  </body>
</html>
