<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2caed1" />
    <title>海边寿司店</title>
    <link rel="stylesheet" href="fishing.css?v=modal-motion-v4-20260804" />
    <link rel="preload" as="image" href="assets/fishing-v2/sea-background.png" fetchpriority="high" />
  </head>
  <body>
    <main class="fishing-stage" aria-label="海边寿司店钓鱼场景">
      <img class="fishing-background" src="assets/fishing-v2/sea-background.png" alt="明亮的海边水面" fetchpriority="high" decoding="async" />
      <div class="fishing-water-glow" aria-hidden="true"></div>

      <header class="fishing-header">
        <div class="fishing-title-card">
          <span>海边寿司店</span>
          <b>码头钓鱼</b>
        </div>
        <div class="fishing-stock-summary" aria-label="本次钓获">
          <span>本次钓获</span>
          <b id="session-catch-count">0 份</b>
        </div>
      </header>

      <section id="fishing-scene" class="fishing-scene" aria-label="木码头和海面">
        <img class="fishing-pier" src="assets/fishing-v2/pier.png" alt="木码头" decoding="async" />
        <img class="fishing-basket" src="assets/fishing-v2/basket.png" alt="鱼篓" decoding="async" />

        <!--
          黄金矿工式钩子：钩组固定在鱼竿尖，而不是按屏幕的固定坐标摆放。
          逻辑可直接修改 #hook-rig 的 --hook-angle / --hook-length，或切换状态类。
        -->
        <div id="angler-rig" class="angler-rig">
          <img class="fishing-angler" src="assets/fishing-v2/fisherman.png" alt="站在码头上钓鱼的寿司店主" decoding="async" />
          <span id="rod-tip" class="rod-tip" aria-hidden="true"></span>
        </div>
        <div id="hook-rig" class="gold-hook-rig" aria-hidden="true">
          <div id="hook-arm" class="gold-hook-arm">
            <div id="fishing-line" class="fishing-line"></div>
            <div id="fishing-hook" class="fishing-hook">
              <span class="fishing-hook-art">
                <span class="fishing-hook-eye"></span>
                <span class="fishing-hook-shank"></span>
                <span class="fishing-hook-curve"></span>
                <span class="fishing-hook-point"></span>
              </span>
            </div>
          </div>
        </div>

        <!-- JS 将已解锁的鱼生成在这个水域里；每个目标使用 .fishing-target。 -->
        <div id="fishing-targets" class="fishing-targets" aria-live="polite" aria-label="水中的鱼群"></div>
        <template id="fishing-target-template">
          <button class="fishing-target" type="button" data-fish-id="">
            <span class="fishing-target-ripple" aria-hidden="true"></span>
            <span class="fishing-target-body"><img src="" alt="" /></span>
          </button>
        </template>

        <!-- 旧版浮标节点保留，避免已缓存的旧脚本报错；黄金矿工玩法不显示它。 -->
        <button id="bobber" class="fishing-bobber" type="button" aria-label="收线" tabindex="-1" aria-hidden="true">
          <img src="assets/fishing-v2/bobber.png" alt="" decoding="async" />
        </button>

        <div id="fishing-speech" class="fishing-speech" aria-live="polite">每天结算后，来海边补充新鲜食材吧。</div>
        <div id="catch-pop" class="catch-pop" aria-live="polite"></div>

        <aside class="fish-stock-board" aria-label="鱼篓库存">
          <div class="fish-stock-heading"><b>鱼篓库存</b><span id="fish-stock-note">冰柜 0/12 份</span></div>
          <div class="fish-stock-list">
            <article class="fish-stock-item" data-fish-id="salmon">
              <img src="assets/fishing-v2/salmon.png" alt="三文鱼" decoding="async" />
              <div><b>三文鱼</b><span id="salmon-status">未解锁</span></div>
              <strong id="salmon-count">0</strong>
            </article>
            <article class="fish-stock-item" data-fish-id="tuna">
              <img src="assets/restaurant/kitchen-layers/optimized/tuna-loin.png" alt="金枪鱼食材" decoding="async" />
              <div><b>金枪鱼</b><span id="tuna-status">未解锁</span></div>
              <strong id="tuna-count">0</strong>
            </article>
            <article class="fish-stock-item" data-fish-id="shrimp">
              <img src="assets/restaurant/kitchen-layers/optimized/shrimp-whole.png" alt="甜虾食材" decoding="async" />
              <div><b>甜虾食材</b><span id="shrimp-status">未解锁</span></div>
              <strong id="shrimp-count">0</strong>
            </article>
          </div>
        </aside>
      </section>

      <footer class="fishing-controls">
        <p id="fishing-instruction" aria-live="polite">钩子会来回摆动，瞄准鱼后点击发射。</p>
        <div>
          <button id="fishing-button" class="fishing-primary-button" type="button">发射钩子</button>
          <button id="finish-fishing-button" class="fishing-secondary-button" type="button">回店里</button>
        </div>
      </footer>

      <section id="fishing-result-overlay" class="fishing-result-overlay is-hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="fishing-result-title">
        <div class="fishing-result-card">
          <span>收获已带回鱼篓</span>
          <b id="fishing-result-title">这次钓得不错！</b>
          <p>本次获得 <strong id="result-catch-count">0</strong> 份食材。</p>
          <button id="back-to-kitchen-button" type="button">回店里继续准备</button>
        </div>
      </section>
    </main>
    <script src="audio.js?v=soft-foley-v1-20260805"></script>
    <script src="fishing.js?v=soft-foley-v74-20260805"></script>
  </body>
</html>
