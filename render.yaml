services:
  - type: web
    name: seaside-sushi-leaderboard-nornttyy
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: seaside-sushi-leaderboard-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://nornttyy.github.io

databases:
  - name: seaside-sushi-leaderboard-db
    plan: free
    region: singapore
    databaseName: seaside_sushi_leaderboard
    user: seaside_sushi_owner
